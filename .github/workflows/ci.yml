name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: app_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create crud_test database
        run: psql -h localhost -p 5433 -U postgres -c 'CREATE DATABASE crud_test'
        env:
          PGPASSWORD: secret
      - run: pnpm lint
      - run: pnpm lint:arch
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:crud
      - run: pnpm test:e2e
      - run: pnpm build
      - name: Build container image
        run: docker build --tag nest-boilerplate:ci .
